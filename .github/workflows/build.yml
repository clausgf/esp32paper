name: build

# Builds the SECRETLESS firmware (no settings.h / secrets.ini in CI, so the seed
# defaults are empty and no credentials end up in the binary — the device reuses
# the values already in its NVS). See README "Secrets" / "Firmware updates".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install 'platformio==6.1.19' 'esptool==4.8.1'

      - name: Build (secretless / generic OTA image, both targets)
        run: pio run

      - name: Stage firmware
        run: |
          mkdir -p dist
          cp .pio/build/waveshare_esp32_driver/firmware.bin dist/firmware-waveshare_esp32_driver.bin
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin dist/firmware-seeed_xiao_esp32s3.bin

      # Full-flash images (bootloader + partition table + otadata + app merged
      # at their real flash offsets, flashable at 0x0 with e.g. `esptool.py
      # write_flash 0x0 merged-<board>.bin`) for initial/blank-board flashing,
      # plus a human-readable dump of each board's partition table. Offsets
      # and flash_mode/freq/size below match what `pio run -t upload -v`
      # prints for each env. gen_esp32part.py is pure stdlib (comes from the
      # arduino-esp32 framework package `pio run` just fetched); esptool.py is
      # the pip package installed above (~/.platformio/penv only exists for a
      # full PlatformIO Core install, not this pip-installed one).
      - name: Build full-flash images + readable partition tables
        run: |
          GENPART=~/.platformio/packages/framework-arduinoespressif32/tools/gen_esp32part.py
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin

          # waveshare_esp32_driver: ESP32-WROOM-32 (esp32), 4 MB flash, bootloader @ 0x1000
          esptool.py --chip esp32 merge_bin \
            -o dist/merged-waveshare_esp32_driver.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/waveshare_esp32_driver/bootloader.bin \
            0x8000 .pio/build/waveshare_esp32_driver/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/waveshare_esp32_driver/firmware.bin
          python3 "$GENPART" .pio/build/waveshare_esp32_driver/partitions.bin \
            > dist/partitions-waveshare_esp32_driver.csv

          # seeed_xiao_esp32s3: ESP32-S3 (esp32s3), 8 MB flash, bootloader @ 0x0
          esptool.py --chip esp32s3 merge_bin \
            -o dist/merged-seeed_xiao_esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 .pio/build/seeed_xiao_esp32s3/bootloader.bin \
            0x8000 .pio/build/seeed_xiao_esp32s3/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/seeed_xiao_esp32s3/firmware.bin
          python3 "$GENPART" .pio/build/seeed_xiao_esp32s3/partitions.bin \
            > dist/partitions-seeed_xiao_esp32s3.csv

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            dist/*.bin
            dist/*.csv

      # On a version tag, publish a GitHub Release so each image has a stable,
      # public download URL:
      #   https://github.com/<owner>/<repo>/releases/latest/download/firmware-<env>.bin
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.bin dist/*.csv \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Secretless OTA images (reuse each device's NVS seed). Copy firmware-<board>.bin as-is into your nice4iot project (arduino4iot >= v3.5.0 requests firmware-{board}.bin per device, board from IOT_BOARD_ID). merged-<board>.bin is a full-flash image (bootloader+partitions+app) for a blank board, e.g. \`esptool.py --chip <esp32|esp32s3> write_flash 0x0 merged-<board>.bin\`. partitions-<board>.csv is that board's partition table in human-readable form."
    permissions:
      contents: write
