; PlatformIO Project Configuration File
;
; esp32paper — nicepaper e-paper display firmware for the Waveshare
; ESP32 e-Paper Driver Board, built on arduino4iot + GxEPD2.
;
; See README.md for the design decisions and open points.

[platformio]
default_envs = waveshare_esp32_driver, seeed_xiao_esp32s3
; Optional: keep secrets out of source in a git-ignored secrets.ini instead of
; include/settings.h (see secrets.ini.example and README "Secrets"). Uncomment:
; extra_configs = secrets.ini

[env]
; arduino4iot requires arduino-esp32 3.x, which PlatformIO only ships via the
; pioarduino platform fork (the registry `espressif32` platform is still 2.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Production log level is 2 (ERROR+WARN). Use 5 while debugging.
build_flags =
    -std=gnu++20        ; arduino4iot 3.x requires C++20
    -DCORE_DEBUG_LEVEL=3
    ; Make GxEPD2_BW/3C/7C derive from the common GxEPD2_GFX base so the runtime
    ; panel factory can hold them via one GxEPD2_GFX* (see src/panels.h).
    -DENABLE_GxEPD2_GFX=1
    ; --- panel support (PANEL_* opt-in list; enable any subset — the active panel is
    ;     chosen at runtime from config.json "panel" > NVS > default). Only the
    ;     selected panel uses RAM; unused ones cost only flash. See src/panels.h.
    -DPANEL_GDEW042T2=1     ; GDEW042T2  4.2" 400x300 b/w      -> bw
    -DPANEL_GDEW075T7=1     ; GDEW075T7  7.5" 800x480 b/w      -> bw
    -DPANEL_GDEH075Z90=1    ; GDEH075Z90 7.5" 800x480 b/w/red  -> bwr
    -DPANEL_GDEP073E01=1     ; GDEP073E01 7.3" 800x480 Spectra6 -> e6
    -DPANEL_ACEP730=1     ; ACeP730 7.3" 800x480 ACeP 7c Waveshare -> c7
    -DPANEL_GDEY073D46=1   ; GDEY073D46 7.3" 800x480 ACeP 7c Good Display -> c7
    ; Panel used before config.json/NVS provide one (falls back to the first
    ; enabled panel if unset). Default hardware: Seeed 7.5" 800x480 b/w (UC8179,
    ; GDEW075T7-compatible) on the Waveshare ESP32 e-Paper Driver Board:
    -DEPAPER_DEFAULT_PANEL=\"GDEW075T7\"
    ; --- GxEPD2 page-buffer budget in bytes: page height is derived from this
    ;     so every panel is safe by default (see src/panels.h). Raise it for
    ;     fewer PNG re-decodes if your module has spare internal DRAM:
    ; -DEPAPER_PAGE_BYTES=32768
    ; --- one-time seed secrets via git-ignored secrets.ini (see [platformio]
    ;     extra_configs). Omit for the secretless/CI build (reuses NVS):
    ; ${secrets.seed_flags}
build_unflags =
    -std=gnu++11

lib_ldf_mode = chain+
lib_deps =
    ; pinned to a release tag for reproducible builds. Seeds bootstrap config into
    ; NVS (secretless OTA/CI, v3.0.0), self-derives firmware_version telemetry via
    ; git-describe (v3.1.0/v3.3.0), fast NTP (v3.2.0), caches the DHCP lease in RTC
    ; for DORA-free fast reconnect (v3.4.0, iot.setDhcpCache — enabled below), and
    ; reports IOT_BOARD_ID as "board_id" telemetry + substitutes it for {board} in
    ; API paths, defaulting updateFirmware() to firmware-{board}.bin (v3.5.0; see
    ; IOT_BOARD_ID in each [env:...] section below).
    https://github.com/clausgf/arduino4iot#v3.5.2
    zinggjm/GxEPD2 @ ^1.5.3
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    bblanchon/ArduinoJson @ ^7.0.0

[env:waveshare_esp32_driver]
; Waveshare "ESP32 e-Paper Driver Board" carries a plain ESP32-WROOM-32 (4 MB
; flash, no PSRAM).
board = esp32dev
; arduino-esp32 3.x + TLS is large: the default partition table's 1.25 MB OTA
; slots leave almost no headroom. min_spiffs keeps two OTA slots but grows them
; to ~1.9 MB (and shrinks the unused SPIFFS), so OTA updates keep working.
board_build.partitions = min_spiffs.csv
; IOT_BOARD_ID: reported as "board_id" telemetry and substituted for {board} in
; arduino4iot API paths (see updateFirmware() >= v3.5.0); matches this env's
; name and the release asset naming (firmware-<board>.bin) in build.yml.
build_flags =
    ${env.build_flags}
    -DIOT_BOARD_ID=\"waveshare_esp32_driver\"

; --- OTA firmware distribution to the nice4iot server (optional) ---
; Uncomment and adjust to publish new firmware for OTA via scp. arduino4iot
; pulls it from file/{project}/{device}/firmware-{board}.bin on the next wakeup.
; upload_protocol = custom
; upload_command = scp $SOURCE myserver.local:/path/to/nice4iot/data/projects/my-project/firmware-waveshare_esp32_driver.bin

[env:seeed_xiao_esp32s3]
; Seeed XIAO ESP32-S3 (Plus) on the EE04 ePaper Display Board (50-pin FPC).
; 8 MB flash + 8 MB PSRAM; the board's default partition table already gives
; each OTA slot ~3.1 MB, so no board_build.partitions override is needed here
; (unlike waveshare_esp32_driver's 4 MB flash). Pin mapping: src/config.h.
board = seeed_xiao_esp32s3
; See waveshare_esp32_driver above for what IOT_BOARD_ID is used for.
build_flags =
    ${env.build_flags}
    -DIOT_BOARD_ID=\"seeed_xiao_esp32s3\"
